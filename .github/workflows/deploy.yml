name: Deploy React Docker App

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v5

      - name: Show latest commit
        shell: powershell
        run: |
          git log -1 --oneline
          git status

      - name: Stop and remove existing container
        shell: powershell
        run: |
          docker stop react-container 2>$null
          docker rm react-container 2>$null

      - name: Remove old image
        shell: powershell
        run: |
          docker rmi react-app -f 2>$null

      - name: Build new Docker image
        shell: powershell
        run: |
          docker build --no-cache -t react-app .

      - name: Run new container
        shell: powershell
        run: |
          docker run -d `
            --name react-container `
            --restart unless-stopped `
            -p 8080:80 `
            react-app

      - name: Verify deployment
        shell: powershell
        run: |
          Write-Host "Running Containers:"
          docker ps

          Write-Host ""
          Write-Host "Available Images:"
          docker images

          Write-Host ""
          Write-Host "Container Logs:"
          docker logs react-container